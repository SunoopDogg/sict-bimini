services:
  sict-bimini:
    build:
      context: .
    image: python3.14.2:trixie-slim-uv
    container_name: sict-bimini
    tty: true
    ipc: host
    ports:
      - "8000:8000"
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - .:/root/sict-bimini
      - /tmp/.X11-unix:/tmp/.X11-unix

  sict-bimini-gpu:
    extends:
      service: sict-bimini
    container_name: sict-bimini-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu
